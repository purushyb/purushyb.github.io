# The Site Configuration

# Import the theme
theme: jekyll-theme-chirpy

# The language of the webpage
lang: en

# Change to your timezone (Sydney, Australia)
timezone: Australia/Sydney

# jekyll-seo-tag settings
# ↓ --------------------------

title: Purushottam Yadav
tagline: Senior Mobile Developer | Android & Flutter Specialist

description: >-
  Personal blog of Purushottam Yadav Battula. Insights into Android development, 
  Flutter SDKs, and transitions into Machine Learning.

# Note: Ensure this matches your repository name if not using a custom domain.
url: "https://purushyb.github.io"

github:
  username: purushyb

social:
  name: Purushottam Yadav Battula
  email: purushottamyadavbattula@gmail.com
  links:
    - https://github.com/purushyb
    - https://www.linkedin.com/in/purushyb
    - https://purushyb.github.io/masterPortfolio

# ↑ --------------------------

# Web Analytics Settings (Leave empty if not yet set up)
analytics:
  google:
    id: 
  cloudflare:
    id: 

# Page views settings
pageviews:
  provider: 

# Prefer color scheme setting. Empty follows system (Dark/Light)
theme_mode: 

# the avatar on sidebar (Path to your image in /assets/img/...)
avatar: /assets/img/avatar.png

# Global switch for TOC in posts.
toc: true

comments:
  # To enable, use 'giscus' or 'utterances'
  provider: 

# PWA settings for offline support
pwa:
  enabled: true
  cache:
    enabled: true
    deny_paths:
      - "/masterPortfolio" # Exclude your React portfolio from the blog's PWA cache

paginate: 10

# IMPORTANT: Since your repo is likely named 'blog', 
# this ensures links point to purushyb.github.io/blog/
baseurl: ""

# ------------ The following options are not recommended to be modified ------------------

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/# The Site Configuration